<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<meta name="description" content="My TO Do — Personal Task Manager by Shubham">
<meta name="theme-color" content="#0078d4">

<!-- Security headers via meta -->
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="no-referrer">

<!--
  CSP NOTE: 'unsafe-inline' hata sakte ho jab scripts external files mein aa jayein.
  Abhi ke liye rakha hai compatibility ke liye.
  Production mein: script-src se 'unsafe-inline' hatao aur nonce use karo.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://*.onrender.com https://fonts.googleapis.com https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self';">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">

<!-- PWA / Android -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My TO Do">
<link rel="manifest" id="pwa-manifest">

<title>My TO Do</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- App Styles (pehle inline tha, ab external file) -->
<link rel="stylesheet" href="styles.css">

</head>
<body>

<div class="bkdrop" id="bkdrop" data-action="close-sb"></div>

<!-- ═══════════════════════════════════════════════════════
     HTML BODY — body.html se liya gaya
     (sidebar, main area, modals, toasts)
     ═══════════════════════════════════════════════════════ -->

<!-- body.html ka content yahan paste karo,
     ya server-side include use karo jab Vite setup ho -->

<!-- PLACEHOLDER: body.html ka poora content yahan aayega -->
<!-- Abhi ke liye directly include karo: -->

<script>
  // body.html ko dynamically load karne ka ek tarika:
  fetch('body.html')
    .then(r => r.text())
    .then(html => {
      // <body> aur </body> tags ke beech ka content extract karo
      const match = html.match(/<body[^>]*>([\s\S]*)<\/body>/i);
      if (match) document.body.insertAdjacentHTML('afterbegin', match[1]);
    })
    .catch(() => {
      // Agar fetch fail ho toh inline fallback
      console.warn('[MyToDo] body.html load nahi hua — direct HTML use karo');
    });
</script>

<!-- ═══════════════════════════════════════════════════════
     SCRIPTS — order matter karta hai!
     1. app.js      — core logic, CONFIG, API, Sync, Auth
     2. events.js   — event binding layer (DOM ready ke baad)
     3. patches.js  — dynamic renderer patches (last mein)
     ═══════════════════════════════════════════════════════ -->
<script src="app.js"></script>
<script src="events.js"></script>
<script src="patches.js"></script>

</body>
</html>
